apiVersion: apps/v1
kind: Deployment
metadata:
  name: osparty-api
  labels:
    app: osparty-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: osparty-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: osparty-api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: osparty-api
      securityContext:
        sysctls:
          - name: net.core.somaxconn
            value: "65535"
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/osparty/osparty-api:latest
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            # Pinned, not left to ergonomics: the JVM only picks G1 when it sees enough memory and CPUs, so
            # the collector would otherwise change with the container's resource block. Dev proved what the
            # fallback costs -- serial full compactions turned a 67 ms p99 relay into a 5.1 s outlier.
            # 65% of the limit leaves room for metaspace, the code cache and Tomcat's thread stacks, which
            # together account for most of the gap between heap size and RSS.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=65.0"
            - name: DISCORD_SERVICE_URL
              value: ""
          envFrom:
            - secretRef:
                name: osparty-api-env
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          resources:
            # 768Mi under-counted the pod: at a 2Gi limit the heap alone can reach ~1.3 GB, and dev measured
            # 800-900 MB resident under load. The scheduler was placing these as if they were half their
            # real size.
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
