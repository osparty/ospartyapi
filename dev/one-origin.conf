# A local stand-in for the production ingress: REST and every WebSocket on one origin.
#
# Locally there is nothing in front of the service, and it listens on two ports — Tomcat for REST, Netty
# for sockets. A client only knows one base URL, so plugin 1.0.50 cannot reach both: pointed at 8080 its
# capabilities probe succeeds and its socket fails, pointed at 8081 the reverse. This puts them back
# together at http://localhost:8000, routed exactly as k8s/overlays/*/kustomization.yaml route them.
#
# Note the client IP the board sees is this proxy's, not the caller's, so report rate limiting groups
# every client here into one. Fine for everything but testing that limit.

upstream rest {
	server api:8080;
}

upstream sockets {
	server api:8081;
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 8000;

	# Both protocols on one connection, optionally pinned to a pod. There is one pod locally, so /n/ is
	# here only so a client that stamps a node hint is not turned away for it.
	location /api/ws {
		proxy_pass http://sockets;
		include /etc/nginx/conf.d/upgrade.inc;
	}

	location /n/ {
		proxy_pass http://sockets;
		include /etc/nginx/conf.d/upgrade.inc;
	}

	# The ad board alone, untagged. Plugin 1.0.50's fallback; goes when that release does.
	location /api/v1/ws/parties {
		proxy_pass http://sockets;
		include /etc/nginx/conf.d/upgrade.inc;
	}

	location / {
		proxy_pass http://rest;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}
}
