name: Deploy API (Kubernetes)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy. dev is the isolated osparty-dev namespace (own Redis, testing.osparty.net, Party V2 enabled).'
        type: choice
        options: [prod, dev]
        default: prod
        required: true
      version:
        description: 'Explicit version (e.g. 1.1.0 for a minor bump, or an old version to redeploy). Empty = auto patch bump. Ignored for dev, which is tagged dev-<sha>.'
        required: false
permissions:
  contents: write
  packages: write
concurrency:
  # Per-environment, so a dev deploy never queues behind (or cancels) a prod one.
  group: deploy-api-k8s-${{ github.event.inputs.environment }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/osparty/osparty-api
  DEPLOY_DIR: osparty-api
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version (auto patch bump)
        id: version
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            # Dev never consumes a release version: it is pinned to the commit it was built from, so
            # deploying dev can't bump prod's version series or move the :latest tag.
            VERSION="dev-$(echo "${GITHUB_SHA}" | cut -c1-7)"
            echo "Dev deploy — using $VERSION"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using explicit version: $VERSION"
          else
            LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            if [ -z "$LATEST" ]; then
              VERSION="1.0.0"
              echo "No version tags yet — starting at $VERSION"
            else
              VERSION=$(echo "${LATEST#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
              echo "Latest tag $LATEST -> bumping patch to $VERSION"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Only prod moves :latest — dev images must never become what a `latest` pull resolves to.
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            echo "tags=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build and test
        run: ./gradlew --no-daemon clean test bootJar -PappVersion=${{ steps.version.outputs.version }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Render manifests (selected overlay, image pinned to this version)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          cd "k8s/overlays/${ENVIRONMENT}"
          kustomize edit set image ${IMAGE}=${IMAGE}:${VERSION}
          kustomize build . -o "${GITHUB_WORKSPACE}/k8s-${ENVIRONMENT}.yaml"
          echo "Rendered image refs:"; grep 'image:' "${GITHUB_WORKSPACE}/k8s-${ENVIRONMENT}.yaml"
          echo "Target namespaces:"; grep -E '^\s+namespace:' "${GITHUB_WORKSPACE}/k8s-${ENVIRONMENT}.yaml" | sort -u

      - name: Copy rendered manifests to api01
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.API_SERVER_ADDRESS }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: k8s-${{ github.event.inputs.environment }}.yaml
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true
      - name: Apply + wait for rollout
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          VERSION: ${{ needs.build.outputs.version }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          NAMESPACE: ${{ github.event.inputs.environment == 'dev' && 'osparty-dev' || 'osparty' }}
          # Dev runs the API as a StatefulSet so its pods are individually routable (node-hint routing).
          WORKLOAD: ${{ github.event.inputs.environment == 'dev' && 'statefulset/osparty-api' || 'deployment/osparty-api' }}
        with:
          host: ${{ secrets.API_SERVER_ADDRESS }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_DIR,VERSION,ENVIRONMENT,NAMESPACE,WORKLOAD
          script: |
            set -euo pipefail
            kubectl apply -f "$DEPLOY_DIR/k8s-${ENVIRONMENT}.yaml"
            # Fails the job (non-zero) if the new pods never go Ready — old pods keep serving
            # (maxUnavailable: 0), so a broken image never takes traffic.
            kubectl -n "$NAMESPACE" rollout status "$WORKLOAD" --timeout=300s
            echo "Deployed osparty-api ${VERSION} to namespace ${NAMESPACE}"

  release:
    needs: [build, deploy]
    # Dev deploys are throwaway builds off a feature branch: no version tag, no GitHub release.
    if: github.event.inputs.environment != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this commit as v${{ needs.build.outputs.version }}
        id: tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists (redeploy of an existing version) — skipping tag + release."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v${VERSION}" "${GITHUB_SHA}"
            git push origin "v${VERSION}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
