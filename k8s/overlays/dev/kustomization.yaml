# Dev environment: a second, fully isolated copy of the API next to prod, used to exercise the Party V2
# work that needs more than one pod — node-hint routing, redirect, ownership failover, drain across a
# rolling deploy (PARTY_V2_MIGRATION.md P2/P4).
#
# Isolation from prod is by namespace: its own Redis (so both the ad board's `party:` keys and V2's `pv2:`
# keys are separate), its own ingress host (testing.osparty.net), its own image tag. Prod is untouched by
# anything deployed here.
#
# The base Deployment is replaced by a StatefulSet (see statefulset.yaml) because node-hint routing needs
# individually addressable pods. That is the one structural difference from prod, and the thing this
# environment exists to prove before prod follows.
#
# Manual steps before the first deploy — the namespace needs two secrets the base expects:
#
#   kubectl create namespace osparty-dev
#   kubectl -n osparty-dev create secret generic osparty-api-env \
#     --from-literal=SPRING_DATA_REDIS_PASSWORD="$(openssl rand -hex 24)"
#   # image pull credentials, copied from prod:
#   kubectl -n osparty get secret ghcr-pull -o yaml \
#     | sed 's/namespace: osparty/namespace: osparty-dev/' \
#     | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: osparty-dev
resources:
  - namespace.yaml
  - ../../base
  - statefulset.yaml
  - pod-services.yaml
images:
  - name: ghcr.io/osparty/osparty-api
    newTag: latest
patches:
  # The StatefulSet takes the Deployment's place; both would otherwise fight over the same pod labels.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: osparty-api
      $patch: delete
  # Node-hint routing: /n/{podName}/... goes to that exact pod, everything else round-robins as usual.
  # Ingress gives the longest matching prefix priority, so the /n/ paths win over /.
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: osparty-api
      spec:
        tls:
          - hosts:
              - testing.osparty.net
            secretName: osparty-api-testing-tls
        rules:
          - host: testing.osparty.net
            http:
              paths:
                - path: /n/osparty-api-0
                  pathType: Prefix
                  backend:
                    service:
                      name: osparty-api-n0
                      port:
                        name: http
                - path: /n/osparty-api-1
                  pathType: Prefix
                  backend:
                    service:
                      name: osparty-api-n1
                      port:
                        name: http
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: osparty-api
                      port:
                        name: http
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 256Mi
  # Drop the base dashboard here: the Grafana sidecar watches all namespaces, so a second copy would fight
  # with prod's over the same dashboard uid. Dev gets its own instead — see configMapGenerator below.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboard-osparty-api
      $patch: delete
# Dev's own dashboard (uid osparty-api-dev), scoped to this namespace and led by the Party V2 panels the
# base dashboard has no reason to carry. Prod's queries are namespace-scoped to `osparty`, so the two
# environments no longer land in each other's graphs — which they did while dev ran the same app name and
# the same ServiceMonitors one namespace over.
configMapGenerator:
  - name: grafana-dashboard-osparty-api-dev
    files:
      - dashboards/osparty-api-dev.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
