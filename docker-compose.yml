services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: osparty
      POSTGRES_USER: osparty
      POSTGRES_PASSWORD: osparty
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osparty -d osparty"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  api:
    image: ghcr.io/osparty/osparty-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      POSTGRES_URL: jdbc:postgresql://postgres:5432/osparty
      POSTGRES_USER: osparty
      POSTGRES_PASSWORD: osparty
      DISCORD_SERVICE_URL: "${DISCORD_SERVICE_URL:-}"
      DISCORD_INTERNAL_TOKEN: "${DISCORD_INTERNAL_TOKEN:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      DISCORD_REDIRECT_URI: "${DISCORD_REDIRECT_URI:-}"
      # Frame-level tracing, for working out what a client of another version is actually sending. INFO
      # already reports every seat, resync and lookup; DEBUG adds each inbound frame and each relay round,
      # naming the members in it. Left at INFO because the live party's frames are the hottest thing here.
      #
      # With the one-origin proxy, which plugin 1.0.50 needs to reach REST and the socket at one base URL:
      #   PARTY_LOG=DEBUG BOARD_LOG=DEBUG docker compose --profile one-origin up -d --build
      # Then point the plugin at http://localhost:8000, not 8080. The logs are still the api service's.
      LOGGING_LEVEL_NET_OSPARTY_API_PARTY: "${PARTY_LOG:-INFO}"
      LOGGING_LEVEL_NET_OSPARTY_API_WEB_WS: "${BOARD_LOG:-INFO}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # REST.
      - "8080:8080"
      # Every WebSocket. Locally there is no ingress to unify the two, so a client pointed at 8080 will
      # reach the capabilities probe and then fail to open a socket — point it here for the socket.
      - "8081:8081"
    expose:
      - "9090"
    restart: unless-stopped
  # A stand-in for the production ingress, putting REST and every WebSocket on one origin at :8000.
  # Plugin 1.0.50 needs it — its capabilities probe is REST and its socket is not, and it has one base
  # URL for both. Opt in with `--profile one-origin`; nothing else here wants it.
  one-origin:
    image: nginx:1.27-alpine
    profiles: ["one-origin"]
    depends_on:
      - api
    volumes:
      - ./dev/one-origin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dev/upgrade.inc:/etc/nginx/conf.d/upgrade.inc:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on:
      - api
    restart: unless-stopped
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://monitoring.osparty.net}"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HTTP_PORT:-3001}:3000"
    restart: unless-stopped
volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
