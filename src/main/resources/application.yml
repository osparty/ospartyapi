server:
  port: 8080
  tomcat:
    # Connection limits still matter under virtual threads — they bound sockets and the accept
    # backlog, not threads. The `threads.max`/`min-spare` pool sizing that used to sit here does
    # not: with virtual threads Tomcat takes a thread-per-request executor and ignores it.
    max-connections: 20000
    accept-count: 2000

spring:
  application:
    name: osrs-party-api
  threads:
    virtual:
      # Every socket frame this service handles ends in a blocking Redis or Postgres call, so the
      # old 800-thread pool was really a cap on how many of those could be in flight at once —
      # queueing behind each other under load. Virtual threads make blocking cheap, so the limit
      # becomes the datastore rather than the pool.
      #
      # This needs Java 21+ to exist and Java 24+ to be worth having: before JEP 491 a virtual
      # thread blocking inside a `synchronized` block pinned its carrier, and Tomcat's WebSocket
      # send path is synchronized — so on 21 this would have traded a thread pool for a smaller,
      # subtler one. On 25 it does not.
      enabled: true
  jackson:
    default-property-inclusion: always
  task:
    scheduling:
      # Spring defaults this to a single thread, which every @Scheduled job then shares. Party V2's
      # ownership renewal runs every 10s and its reclaim scan every 30s, and both walk hundreds of rooms
      # doing a Redis round trip each — so on one thread the scan delays the renewal. Miss the 30s lock TTL
      # and the room is taken by another node, which is a real handover for every member of every party
      # involved. A 14k-socket run lost ownership of 251 rooms this way with no pod ever restarting.
      pool:
        size: 4
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/osparty}
    username: ${POSTGRES_USER:osparty}
    password: ${POSTGRES_PASSWORD:osparty}
    hikari:
      pool-name: osparty-pg
      # With virtual threads there is no longer a request-thread pool in front of this, so the
      # connection pool is the only thing bounding concurrent database work — worth a little more
      # headroom than when 800 platform threads were the real ceiling. 10 per replica x 3 replicas
      # is still well under Postgres' default max_connections of 100.
      maximum-pool-size: ${POSTGRES_POOL_MAX:10}
      minimum-idle: 1
      # Fail fast rather than pile up: a saturated pool should surface as an error on the rare
      # database path, not as unbounded waiting on the socket path.
      connection-timeout: 3000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}

app:
  ads:
    ttl-ms: 90000
    # Parties older than this are purged outright, even with a live host heartbeat.
    stale-purge-age-ms: 7200000
    stale-purge-cron: "0 */5 * * * *"
  ws:
    enabled: true
    reconcile-interval-ms: 5000
    touch-interval-ms: 5000
  party-v2:
    # Which server carries the live socket: `tomcat` (the servlet container, alongside everything else on
    # server.port) or `netty` (its own port, below). Tomcat's send path is roughly half this service's CPU,
    # so both ship in the same image and the comparison is a config flip rather than a deploy.
    transport: ${APP_PARTY_V2_TRANSPORT:tomcat}
    port: ${APP_PARTY_V2_PORT:8081}
    # How long a room with nothing urgent pending may hold its live updates. The aggregation window
    # (aggregate-ms, 300) still governs anything a sender marked urgent — a vital that moved down — so
    # combat is unaffected and the banking/travelling that fills most of a session costs one round a
    # second instead of three. Sends are what this service's CPU tracks.
    aggregate-idle-ms: 1000
    # Members this node must be carrying above the lightest node before a new party is placed elsewhere.
    # A redirect costs the host a reconnect, so small imbalances are left alone — parties end, which
    # levels them out on its own.
    rebalance-threshold: 20
    # A member silent for this long is treated as gone. The socket cannot be trusted for this: a half-open
    # connection leaves the session reporting open forever, so the room never empties and its ownership lock
    # is renewed for the life of the node. Generous next to the plugin's forced resync every ~6s.
    member-timeout-ms: 90000
  bans:
    # Each node refreshes its own ban snapshot on this interval, so a ban propagates cluster-wide
    # within one refresh plus one reconcile tick. No inter-node messaging required.
    refresh-ms: 5000
    # Kill switches. Hiding the ad from these two lookups closes the last discovery routes, but
    # both are reachable by the banned host's own client, so they can be turned off without a
    # redeploy if they ever surface the ban to its subject.
    filter-get-by-host: true
    filter-get-by-code: true
  reports:
    enabled: true
    # Distinct reporters required before a review message is posted to Discord.
    notify-threshold: 1
    per-session-max: 5
    # One review message per host per this window, however many ads they re-post.
    per-party-cooldown-ms: 1800000
    # Circuit breaker: above this, reports are still recorded but not forwarded to Discord.
    global-per-minute: 20
    # Unreviewed reports are dropped after this long. Reviewed ones are kept: the Discord Unban
    # button resolves its subject through the report row.
    retention-days: 90
    purge-cron: "0 30 4 * * *"
    # Salt for the stored reporter IP hash. Raw IPs are never persisted.
    ip-hash-pepper: ${REPORT_IP_PEPPER:}
  discord:
    service-url: ${DISCORD_SERVICE_URL:}
    internal-token: ${DISCORD_INTERNAL_TOKEN:}
    oauth:
      client-id: ${DISCORD_CLIENT_ID:}
      client-secret: ${DISCORD_CLIENT_SECRET:}
      redirect-uri: ${DISCORD_REDIRECT_URI:}

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Pinned explicitly: the probes must stay tied to the application availability state so that
      # adding a datasource (and its `db` health indicator) can never start failing readiness and
      # roll pods out of the load balancer during a Postgres blip.
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState

logging:
  level:
    net.osparty.api.requests: INFO
