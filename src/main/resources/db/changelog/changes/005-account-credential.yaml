databaseChangeLog:
  # Per-install credentials, one row per (account, machine) pair.
  #
  # These are the only proof of identity this service has ever had, and they are records rather than
  # cache. Losing them does not log people out politely -- it drops every account back to
  # trust-on-first-use at the same moment, and enrolment is first-come-first-served, so a lost table
  # is an open window in which anyone who knows an account hash can claim it. That is why this is
  # Postgres and not Redis, and why nothing here carries a TTL. Redis sits in front as a
  # read-through cache because the token is verified on every WebSocket handshake.
  #
  # Only the SHA-256 of the token is stored. The token itself exists in exactly two places: the
  # client that owns it, and the response that issued it. A dump of this table is not a set of
  # working credentials.
  #
  # Several rows per account is the normal case, not an anomaly -- the same character logs in from a
  # desktop and a laptop, and each install enrols separately. The account is the identity; the rows
  # are the machines that may speak for it.
  - changeSet:
      id: 005-1-create-account-credential
      author: osparty
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE account_credential (
                token_hash   CHAR(64) PRIMARY KEY,
                account_hash BIGINT NOT NULL,
                label        VARCHAR(64),
                issued_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
                last_seen_at TIMESTAMPTZ NOT NULL DEFAULT now(),
                revoked_at   TIMESTAMPTZ
              );
              CREATE INDEX account_credential_account_idx
                ON account_credential (account_hash) WHERE revoked_at IS NULL;
      rollback:
        - sql:
            sql: DROP TABLE account_credential

  # Recorded for every enrolment, kept when the credential it describes is revoked or replaced.
  #
  # Enrolment is the one moment this scheme can be attacked: whoever first presents an account hash
  # is believed. There is no way to make that decision safe at the time it is made, so the mitigation
  # is that it is never silent -- a user who finds a device they do not recognise, or a support
  # request about a hijacked account, needs a history that outlives the credential. A log that is
  # deleted along with what it describes is not a log.
  - changeSet:
      id: 005-2-create-account-enrolment-log
      author: osparty
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE account_enrolment (
                id           BIGSERIAL PRIMARY KEY,
                account_hash BIGINT NOT NULL,
                client_ip    VARCHAR(64),
                first_device BOOLEAN NOT NULL,
                enrolled_at  TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE INDEX account_enrolment_account_idx ON account_enrolment (account_hash);
      rollback:
        - sql:
            sql: DROP TABLE account_enrolment
