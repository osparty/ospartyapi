apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: osparty
resources:
  - namespace.yaml
  - ../../base
  - statefulset.yaml
  - pod-services.yaml
images:
  - name: ghcr.io/osparty/osparty-api
    newTag: latest
patches:
  # The round-robin Service needs the live port too, for the un-hinted form of the merged socket: a client
  # not yet in a party has no node to prefer and should land wherever the gateway sends it.
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: osparty-api
      spec:
        ports:
          - name: http
            port: 8080
            targetPort: http
          - name: live
            port: 8081
            targetPort: live
          - name: management
            port: 9090
            targetPort: management
  # Node-hint routing: /n/{podName}/... goes to that exact pod, everything else round-robins. Ingress
  # gives the longest matching prefix priority, so the /n/ paths win over the bare ones, and the bare
  # socket paths win over /.
  #
  # Every WebSocket is served by Netty on `live`; REST stays on Tomcat's `http`.
  #
  # /api/v1/ws/parties is the ad board on its own connection, for clients that predate the merged socket.
  # It is node-agnostic, so it goes to the round-robin Service. Retire it once
  # osparty_ws_connections{endpoint="board"} reads zero.
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: osparty-api
      spec:
        rules:
          - host: api.osparty.net
            http:
              paths:
                - path: /n/osparty-api-0/api/ws
                  pathType: Prefix
                  backend:
                    service:
                      name: osparty-api-n0
                      port:
                        name: live
                - path: /n/osparty-api-1/api/ws
                  pathType: Prefix
                  backend:
                    service:
                      name: osparty-api-n1
                      port:
                        name: live
                - path: /n/osparty-api-2/api/ws
                  pathType: Prefix
                  backend:
                    service:
                      name: osparty-api-n2
                      port:
                        name: live
                - path: /api/ws
                  pathType: Prefix
                  backend:
                    service:
                      name: osparty-api
                      port:
                        name: live
                - path: /api/v1/ws/parties
                  pathType: Prefix
                  backend:
                    service:
                      name: osparty-api
                      port:
                        name: live
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: osparty-api
                      port:
                        name: http
