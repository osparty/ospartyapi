databaseChangeLog:
  # Ledger of one-shot data migrations — the movement of existing rows, as distinct from the schema
  # changes Liquibase's own databasechangelog tracks.
  #
  # Rows are written after the work succeeds rather than before. Claiming first would let a replica
  # that died mid-import leave a migration marked done and permanently half-applied; claiming after
  # means the worst case is two replicas doing the same idempotent work once.
  - changeSet:
      id: 004-1-create-data-migration
      author: osparty
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE data_migration (
                name       VARCHAR(64) PRIMARY KEY,
                applied_at TIMESTAMPTZ NOT NULL DEFAULT now(),
                note       VARCHAR(500)
              )
      rollback:
        - sql:
            sql: DROP TABLE data_migration
