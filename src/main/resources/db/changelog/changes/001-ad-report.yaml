databaseChangeLog:
  # A player-submitted report about one ad-board advertisement.
  #
  # Every subject column is denormalised on purpose. Ads carry a 90 second TTL, so by the time a
  # moderator opens Discord and clicks a button the advertisement is long gone from Redis. The row
  # -- and `ad_snapshot` in particular -- is the only surviving evidence of what was reported, and
  # it is what the ban endpoint resolves its subject from.
  #
  # Every reporter column is self-asserted. There is no account authentication anywhere in this
  # system: `identify` is client-supplied and host keys are client-minted. These columns exist for
  # spotting abuse patterns after the fact, never for authorisation.
  - changeSet:
      id: 001-1-create-ad-report
      author: osparty
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE ad_report (
                id                       BIGSERIAL PRIMARY KEY,
                created_at               TIMESTAMPTZ NOT NULL DEFAULT now(),

                party_id                 VARCHAR(64) NOT NULL,
                host_name                VARCHAR(64) NOT NULL,
                host_name_raw            VARCHAR(64),
                host_account_hash        BIGINT,
                activity                 VARCHAR(64),
                description              VARCHAR(1000),
                world                    VARCHAR(16),
                capacity                 INT,
                party_size               INT,
                invite_code              VARCHAR(32),
                ad_snapshot              JSONB NOT NULL,

                reporter_name            VARCHAR(64),
                reporter_account_hash    BIGINT,
                reporter_session_id      VARCHAR(64),
                reporter_ip_hash         CHAR(64),

                status                   VARCHAR(16) NOT NULL DEFAULT 'PENDING',
                reviewed_at              TIMESTAMPTZ,
                reviewed_by_discord_id   VARCHAR(32),
                reviewed_by_discord_name VARCHAR(64),
                notified                 BOOLEAN NOT NULL DEFAULT FALSE,
                discord_channel_id       VARCHAR(32),
                discord_message_id       VARCHAR(32),
                resulting_ban_id         BIGINT,

                CONSTRAINT ad_report_status_valid
                  CHECK (status IN ('PENDING', 'BANNED', 'DISMISSED'))
              )
      rollback:
        - sql:
            sql: DROP TABLE ad_report

  - changeSet:
      id: 001-2-index-ad-report
      author: osparty
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX ad_report_host_idx     ON ad_report (host_name, created_at DESC);
              CREATE INDEX ad_report_party_idx    ON ad_report (party_id);
              CREATE INDEX ad_report_pending_idx  ON ad_report (created_at DESC) WHERE status = 'PENDING';
              CREATE INDEX ad_report_reporter_idx ON ad_report (reporter_account_hash, created_at DESC);
              CREATE INDEX ad_report_ip_idx       ON ad_report (reporter_ip_hash, created_at DESC);
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP INDEX ad_report_host_idx;
              DROP INDEX ad_report_party_idx;
              DROP INDEX ad_report_pending_idx;
              DROP INDEX ad_report_reporter_idx;
              DROP INDEX ad_report_ip_idx;
